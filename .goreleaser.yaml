version: 2

project_name: wharf

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/wharf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/idesyatov/wharf/internal/version.Version={{.Version}}
      - -X github.com/idesyatov/wharf/internal/version.Commit={{.ShortCommit}}
      - -X github.com/idesyatov/wharf/internal/version.BuildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: idesyatov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/idesyatov/wharf
    description: Terminal UI for managing Docker Compose stacks
    license: MIT
    install: |
      bin.install "wharf"
    test: |
      system "#{bin}/wharf", "--version"

dockers:
  - image_templates:
      - "ghcr.io/idesyatov/wharf:{{ .Version }}-amd64"
      - "ghcr.io/idesyatov/wharf:latest-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/idesyatov/wharf"
    goarch: amd64

  - image_templates:
      - "ghcr.io/idesyatov/wharf:{{ .Version }}-arm64"
      - "ghcr.io/idesyatov/wharf:latest-arm64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/idesyatov/wharf"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/idesyatov/wharf:{{ .Version }}"
    image_templates:
      - "ghcr.io/idesyatov/wharf:{{ .Version }}-amd64"
      - "ghcr.io/idesyatov/wharf:{{ .Version }}-arm64"

  - name_template: "ghcr.io/idesyatov/wharf:latest"
    image_templates:
      - "ghcr.io/idesyatov/wharf:latest-amd64"
      - "ghcr.io/idesyatov/wharf:latest-arm64"
